name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

      - name: Build Windows binaries
        run: cargo build --release -p padbridge-app -p padbridge-cli

      - uses: actions/upload-artifact@v5
        with:
          name: PadBridge-windows
          path: |
            target/release/PadBridge.exe
            target/release/padbridge-cli.exe

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Swift package tests (protocol + networking, on macOS)
        working-directory: ios/PadBridgeKit
        run: swift test

      - name: Generate Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Archive (unsigned)
        working-directory: ios
        run: |
          xcodebuild archive \
            -project PadBridge.xcodeproj \
            -scheme PadBridge \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/PadBridge.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package IPA
        working-directory: ios/build
        run: |
          mkdir Payload
          cp -R PadBridge.xcarchive/Products/Applications/PadBridge.app Payload/
          test -d Payload/PadBridge.app/PlugIns/PadBridgeBroadcast.appex
          zip -qry PadBridge-unsigned.ipa Payload

      - uses: actions/upload-artifact@v5
        with:
          name: PadBridge-unsigned-ipa
          path: ios/build/PadBridge-unsigned.ipa
