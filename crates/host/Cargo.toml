[package]
name = "padbridge-host"
description = "Windows-side PadBridge logic shared by the CLI and the desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chacha20poly1305 = "0.10"
getrandom = "0.3"
hkdf = "0.12"
mdns-sd = "0.21.7"
openh264 = "0.9.9"
padbridge-protocol = { path = "../protocol" }
padbridge-usbmux = { path = "../usbmux" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Display","Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_Controls", "Win32_UI_Input_Pointer", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Media_MediaFoundation", "Win32_Security_Cryptography", "Win32_System_Com", "Win32_System_Registry","Win32_System_Variant", "Win32_System_Ole"] }

[dev-dependencies]
png = "0.18"
