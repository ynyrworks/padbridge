[package]
name = "padbridge-host"
description = "Windows-side PadBridge logic shared by the CLI and the desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
mdns-sd = "0.21.7"
openh264 = "0.9.9"
padbridge-protocol = { path = "../protocol" }
padbridge-usbmux = { path = "../usbmux" }

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_Controls", "Win32_UI_Input_Pointer", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Variant", "Win32_System_Ole"] }

[dev-dependencies]
png = "0.18"
