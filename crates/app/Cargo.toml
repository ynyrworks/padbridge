[package]
name = "padbridge-app"
description = "PadBridge desktop app for Windows"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "PadBridge"
path = "src/main.rs"

[dependencies]
eframe = "0.35.0"
padbridge-host = { path = "../host" }
padbridge-protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
winresource = "0.1"
